<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquidación de Sueldos</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --accent1: #00ffaa;
    --accent2: #00cfff;
    --text: #ffffff;
    --muted: #555570;
    --selected-bg: linear-gradient(135deg, #00ffaa, #00cfff);
    --radius: 16px;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 32px 20px 20px;
  }
 
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    line-height: 1;
    letter-spacing: 1px;
  }
 
  h1 span {
    background: var(--selected-bg);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
 
  .subtitle {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
 
  .header { margin-bottom: 28px; }
 
  /* Progress bar */
  .progress-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
  }
  .progress-bar .seg {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    transition: background 0.3s;
  }
  .progress-bar .seg.done { background: var(--accent1); }
 
  /* Sections */
  .section { margin-bottom: 24px; }
 
  .section-label {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
 
  .section-sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
 
  /* Grid options */
  .options-grid {
    display: grid;
    gap: 10px;
  }
 
  .options-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .options-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .options-grid.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
 
  .option-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 10px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s ease;
    line-height: 1.3;
  }
 
  .option-btn .big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    display: block;
    letter-spacing: 1px;
  }
 
  .option-btn .small {
    font-size: 0.68rem;
    color: var(--muted);
    display: block;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
 
  .option-btn:hover {
    border-color: var(--accent1);
  }
 
  .option-btn.selected {
    background: var(--selected-bg);
    border-color: transparent;
    color: #000;
  }
 
  .option-btn.selected .small { color: #00000088; }
 
  /* Bottom actions */
  .spacer { flex: 1; }
 
  .btn-confirmar {
    width: 100%;
    padding: 20px;
    border-radius: var(--radius);
    border: none;
    background: var(--selected-bg);
    color: #000;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s;
    margin-bottom: 12px;
  }
 
  .btn-confirmar:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
 
  /* Loading / result screens */
  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }
 
  /* Loading */
  .loading-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
 
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent1);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
 
  @keyframes spin { to { transform: rotate(360deg); } }
 
  .loading-text {
    color: var(--muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
 
  /* Result */
  .result-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
  }
 
  .result-label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
 
  .result-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    background: var(--selected-bg);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
 
  .result-sub {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
  }
 
  .error-box {
    background: #1a0a0a;
    border: 1.5px solid #ff4444;
    border-radius: var(--radius);
    padding: 18px;
    color: #ff6666;
    font-size: 0.85rem;
    line-height: 1.5;
    margin-bottom: 16px;
  }
 
  .btn-volver {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
    width: 100%;
    padding: 10px;
  }
  .btn-volver:hover { color: var(--text); }
</style>
</head>
<body>
 
<!-- PANTALLA PRINCIPAL -->
<div id="screen-main" class="screen active">
  <div class="header">
    <h1>Liquidación<br><span>de Sueldos</span></h1>
  </div>
 
  <!-- Quincena -->
  <div class="section">
    <div class="section-label">¿Qué quincena?</div>
    <div class="section-sub">Primera o segunda quincena del mes</div>
    <div class="options-grid cols-2">
      <button class="option-btn" onclick="select('quincena','Q1',this)">
        <span class="big">Q1</span>
        <span class="small">Del 1 al 15</span>
      </button>
      <button class="option-btn" onclick="select('quincena','Q2',this)">
        <span class="big">Q2</span>
        <span class="small">Del 16 al 31</span>
      </button>
    </div>
  </div>
 
  <!-- Mes -->
  <div class="section">
    <div class="section-label">¿Qué mes?</div>
    <div class="section-sub">Mes de la liquidación</div>
    <div class="options-grid cols-4" id="meses-grid"></div>
  </div>
 
  <!-- Año -->
  <div class="section">
    <div class="section-label">¿Qué año?</div>
    <div class="section-sub">Año de la liquidación</div>
    <div class="options-grid cols-3" id="anios-grid"></div>
  </div>
 
  <div class="spacer"></div>
 
  <button class="btn-confirmar" id="btn-confirmar" disabled onclick="enviar()">
    Confirmar y enviar →
  </button>
</div>
 
<!-- PANTALLA LOADING -->
<div id="screen-loading" class="screen">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-text">Enviando liquidación…</div>
  </div>
</div>
 
<!-- PANTALLA RESULTADO -->
<div id="screen-result" class="screen">
  <div class="header">
    <h1>Liquidación<br><span>de Sueldos</span></h1>
  </div>
  <div id="result-content"></div>
  <div class="spacer"></div>
  <button class="btn-volver" onclick="volver()">← Nueva liquidación</button>
</div>
 
<script>
  const WEBHOOK_URL = 'https://tracing-laptop-unlighted.ngrok-free.dev/webhook/liquidacion-quincena';
 
  const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const MESES_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const hoy = new Date();
  const anioActual = hoy.getFullYear();
 
  let sel = { quincena: null, mes: null, anio: null };
 
  // Render meses
  const mg = document.getElementById('meses-grid');
  MESES.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="big" style="font-size:1.1rem">${m}</span>`;
    btn.onclick = () => select('mes', i + 1, btn);
    mg.appendChild(btn);
  });
 
  // Render años
  const ag = document.getElementById('anios-grid');
  [anioActual - 1, anioActual, anioActual + 1].forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span style="font-size:1rem">${a}</span>`;
    btn.onclick = () => select('anio', a, btn);
    ag.appendChild(btn);
  });
 
  // Preseleccionar mes y año actual
  setTimeout(() => {
    const mesIdx = hoy.getMonth(); // 0-based
    const anioIdx = 1; // el del medio = año actual
    mg.children[mesIdx].click();
    ag.children[anioIdx].click();
  }, 50);
 
  function select(tipo, valor, btn) {
    // Deselect siblings
    btn.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    sel[tipo] = valor;
    checkReady();
  }
 
  function checkReady() {
    const ok = sel.quincena && sel.mes && sel.anio;
    document.getElementById('btn-confirmar').disabled = !ok;
  }
 
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
 
  async function enviar() {
    showScreen('screen-loading');
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          quincena: sel.quincena,
          mes: sel.mes,
          anio: sel.anio,
          mesNombre: MESES_FULL[sel.mes - 1]
        })
      });
 
      const data = await res.json();
      mostrarResultado(data);
    } catch (e) {
      mostrarError(e);
    }
  }
 
  function mostrarResultado(data) {
    const mesNombre = MESES_FULL[sel.mes - 1];
    const titulo = `${sel.quincena} · ${mesNombre} ${sel.anio}`;
 
    let html = `
      <div class="result-card">
        <div class="result-label">Período</div>
        <div class="result-value">${titulo}</div>
        <div class="result-sub">Liquidación enviada por WhatsApp ✓</div>
      </div>`;
 
    if (data.total) {
      html += `
        <div class="result-card">
          <div class="result-label">Total liquidado</div>
          <div class="result-value">$${Number(data.total).toLocaleString('es-AR')}</div>
        </div>`;
    }
    if (data.dolares) {
      html += `
        <div class="result-card">
          <div class="result-label">USD a vender</div>
          <div class="result-value">U$D ${data.dolares}</div>
          ${data.diferencia ? `<div class="result-sub">Diferencia: $${Number(data.diferencia).toLocaleString('es-AR')}</div>` : ''}
        </div>`;
    }
 
    document.getElementById('result-content').innerHTML = html;
    showScreen('screen-result');
  }
 
  function mostrarError(e) {
    document.getElementById('result-content').innerHTML = `
      <div class="error-box">
        Error al conectar con n8n. Asegurate de que tu Mac esté prendida y ngrok corriendo.<br><br>
        <small>${e.message}</small>
      </div>`;
    showScreen('screen-result');
  }
 
  function volver() {
    showScreen('screen-main');
  }
</script>
</body>
</html>
