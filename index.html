<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidación de Sueldos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        select, input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .success {
            display: none;
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
        }
        
        .error {
            display: none;
            background: #ef4444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Liquidación</h1>
        <p class="subtitle">Sistema de pago de sueldos</p>
        
        <form id="liquidacionForm" method="POST" action="https://lamaquina.app.n8n.cloud/form/tOlPBlanBhku5Ll0">
            <div class="form-group">
                <label for="mes">Mes</label>
                <select id="mes" name="mes" required>
                    <option value="">Seleccionar mes</option>
                    <option value="Enero">Enero</option>
                    <option value="Febrero">Febrero</option>
                    <option value="Marzo">Marzo</option>
                    <option value="Abril">Abril</option>
                    <option value="Mayo">Mayo</option>
                    <option value="Junio">Junio</option>
                    <option value="Julio">Julio</option>
                    <option value="Agosto">Agosto</option>
                    <option value="Septiembre">Septiembre</option>
                    <option value="Octubre">Octubre</option>
                    <option value="Noviembre">Noviembre</option>
                    <option value="Diciembre">Diciembre</option>
                </select>
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label for="quincena">Quincena</label>
                    <select id="quincena" name="quincena" required>
                        <option value="">Seleccionar</option>
                        <option value="Q1">Q1</option>
                        <option value="Q2">Q2</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="año">Año</label>
                    <select id="año" name="año" required>
                        <option value="">Seleccionar</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="cotizacion">Cotización del dólar ($)</label>
                <input type="number" id="cotizacion" name="cotizacion" placeholder="Ej: 1200" required step="0.01">
            </div>
            
            <input type="hidden" id="periodo" name="Período">
            <input type="hidden" id="cotizacionFinal" name="Cotización del dólar (en pesos)">
            
            <button type="submit" id="submitBtn">
                <span id="btnText">Ejecutar Liquidación</span>
            </button>
        </form>
        
        <div class="success" id="success">
            ✓ Liquidación ejecutada correctamente
        </div>
        
        <div class="error" id="error">
            ✗ Error al ejecutar. Intentá de nuevo.
        </div>
    </div>
    
    <script>
        const form = document.getElementById('liquidacionForm');
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const mes = document.getElementById('mes').value;
            const quincena = document.getElementById('quincena').value;
            const año = document.getElementById('año').value;
            const cotizacion = document.getElementById('cotizacion').value;
            
            const periodo = `${mes} ${quincena} ${año}`;
            
            document.getElementById('periodo').value = periodo;
            document.getElementById('cotizacionFinal').value = cotizacion;
            
            form.submit();
        });
    </script>
</body>
</html>
